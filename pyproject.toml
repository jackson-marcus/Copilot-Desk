[project]
name = "copilotdesk"
version = "0.1.0"
description = "Multi-agent analytics copilot: a planner routes a natural-language question to a SQL builder over a DuckDB star schema with AST guardrails, a chart recommender, and a grounded narrative writer — every step traced and verifiable."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "plotly>=5.22",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "sqlglot>=25",
    "scikit-learn>=1.5"
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.uv]
# Broken ujson wheel on Windows boxes without msvcp140.dll (see wave-1 repos).
override-dependencies = ["ujson; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilotdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that download data or hit external services",
]

[tool.coverage.run]
source = ["src/copilotdesk"]
